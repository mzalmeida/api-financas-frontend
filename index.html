<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <section id="login" class="card">
      <h1>Login</h1>
      <p class="subtitulo">Entre com sua conta configurada no Supabase Auth.</p>

      <form id="loginForm" novalidate>
        <label for="usuario">Email</label>
        <input type="email" id="usuario" name="usuario" placeholder="voce@exemplo.com" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>

        <button type="submit" id="loginButton">Entrar</button>
      </form>

      <button type="button" id="showForgotPassword" class="btn-link">Esqueci minha senha</button>
      <p id="msg" class="mensagem" aria-live="polite"></p>
    </section>

    <section id="forgotPassword" class="card hidden">
      <h1>Recuperar senha</h1>
      <p class="subtitulo">Informe seu e-mail para receber um link seguro de redefinicao.</p>

      <form id="forgotPasswordForm" novalidate>
        <label for="recoveryEmail">Email</label>
        <input type="email" id="recoveryEmail" name="recoveryEmail" placeholder="voce@exemplo.com" autocomplete="email" required>

        <button type="submit" id="forgotPasswordButton">Enviar link</button>
      </form>

      <div class="acoes-auxiliares">
        <button type="button" id="backToLoginFromForgot" class="btn-link">Voltar ao login</button>
      </div>

      <p id="forgotPasswordMsg" class="mensagem" aria-live="polite"></p>
    </section>

    <section id="resetPassword" class="card hidden">
      <h1>Definir nova senha</h1>
      <p id="resetPasswordSubtitle" class="subtitulo">Use o link seguro recebido por e-mail para definir sua nova senha.</p>

      <form id="resetPasswordForm" novalidate>
        <label for="newPassword">Nova senha</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="No minimo 8 caracteres" autocomplete="new-password" required>

        <label for="confirmPassword">Confirmar nova senha</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita a nova senha" autocomplete="new-password" required>

        <button type="submit" id="resetPasswordButton">Salvar nova senha</button>
      </form>

      <div class="acoes-auxiliares">
        <button type="button" id="backToLoginFromReset" class="btn-link">Voltar ao login</button>
      </div>

      <p id="resetPasswordMsg" class="mensagem" aria-live="polite"></p>
    </section>

    <section id="dados" class="card hidden">
      <div class="topo">
        <div>
          <h1>Dashboard de Gastos</h1>
          <p id="sessionInfo" class="subtitulo"></p>
        </div>
        <button id="btnSair" class="btn-secundario" type="button">Sair</button>
      </div>

      <div class="botoes" id="viewButtons">
        <button type="button" data-view="banco">Banco</button>
        <button type="button" data-view="base">Base</button>
        <button type="button" data-view="recorrentes">Recorrentes</button>
        <button type="button" data-view="fornecedores">Fornecedores</button>
        <button type="button" data-view="duplicadas">Duplicadas</button>
      </div>

      <p id="dashboardMsg" class="mensagem" aria-live="polite"></p>
      <div id="resultado" class="resultado"></div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
